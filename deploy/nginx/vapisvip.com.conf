# VVIP NeoVista — vapisvip.com
# Install:  sudo cp /var/www/projects/vvip/VVIp-Website/deploy/nginx/vapisvip.com.conf /etc/nginx/sites-available/vapisvip.com.conf
#           sudo ln -s /etc/nginx/sites-available/vapisvip.com.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d vapisvip.com -d www.vapisvip.com   # adds HTTPS + http→https redirect
#
# Node app (PM2 "vvip") listens on 127.0.0.1:4380 — see deploy/ecosystem.config.cjs.

upstream vvip_app {
  server 127.0.0.1:4380;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name vapisvip.com www.vapisvip.com;

  # Uncomment after certbot has issued the certificate to make https://vapisvip.com the single canonical host:
  # if ($host = www.vapisvip.com) { return 301 https://vapisvip.com$request_uri; }

  client_max_body_size 100m;   # media uploads (images ≤ 15 MB, videos ≤ 80 MB)
  server_tokens off;

  access_log /var/log/nginx/vapisvip.com.access.log;
  error_log  /var/log/nginx/vapisvip.com.error.log;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

  # Fingerprinted build assets — served straight from disk, cached forever
  location /_astro/ {
    alias /var/www/projects/vvip/VVIp-Website/dist/client/_astro/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # Media library (persistent uploads). Files never change in place.
  location /media/ {
    alias /var/www/projects/vvip/VVIp-Website/storage/uploads/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    types { image/webp webp; video/mp4 mp4; video/webm webm; }
    default_type application/octet-stream;
    location ~ \.(php|html?|js|svg)$ { deny all; }
    access_log off;
  }

  # Static brand files (favicons, icons, og image)
  location ~ ^/(assets|icons|brand)/ {
    root /var/www/projects/vvip/VVIp-Website/dist/client;
    expires 30d;
    access_log off;
    try_files $uri =404;
  }
  location = /og-image.jpg { root /var/www/projects/vvip/VVIp-Website/dist/client; expires 30d; }

  # The old PHP mailer is gone — never execute or serve PHP for this site
  location ~ \.php$ { return 410; }

  # Admin dashboard & APIs — never indexed. The app sends this header too; repeating it here
  # also covers Nginx's own error pages (e.g. 502 while the app restarts).
  location ~ ^/(admin|api)(/|$) {
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header Cache-Control;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    proxy_pass http://vvip_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Everything else: the Astro/Node app (pages, sitemap, robots)
  location / {
    proxy_pass http://vvip_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
